name: Build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        sdk: [jc304_kit, jc305u4_kit, jc310b43_kit, jc320v24.0_kit]
        java_ver: [11, 25]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - name: Install packages
        run: |
          sudo apt install -y git gradle openjdk-${{ matrix.java_ver }}-jdk gcc libpcsclite-dev libpython3-dev
      - name: Build FIDO2Applet
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-${{ matrix.java_ver }}-openjdk-amd64/
          export PATH=$JAVA_HOME/bin:$PATH
          export JC_HOME=sdks/${{ matrix.sdk }}
          ./gradlew buildJavaCard
