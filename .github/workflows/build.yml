name: Build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - name: Install packages
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y git gradle default-jdk gcc libpcsclite-dev libpython3-dev
